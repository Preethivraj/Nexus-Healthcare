      {

        patient_name: "Suresh Nair",
        gender: "Male",
        age: 55,
        primary_complaint: "Acute asthma exacerbation with audible expiratory wheeze",
        urgency: "Urgent",
        current_status: "Nebulization Underway",
        waiting_time: "09:45",

    function App() {
      // Current active view
      const [currentView, setCurrentView] = useState("dashboard"); // 'dashboard', 'workflow', 'rules', 'history', 'escalations', 'analytics', 'note'
      
      // 4-Step Clinical Triage Workflow: 1 (Understand), 2 (Clarify), 3 (Synthesis), 4 (Evaluate)
      const [workflowStep, setWorkflowStep] = useState(1);

      // Telemetry state
      const [stats, setStats] = useState({
        active_assessments: 14,
        awaiting_human_review: 3,
        escalated_today: 5,
        average_intake_time: "2.4m",
        intake_time_delta: "-0.3m"
      });
      const [activeSessions, setActiveSessions] = useState(DEMO_SESSIONS);
      const [urgencyFilter, setUrgencyFilter] = useState("All Urgency Levels");
      const [searchQuery, setSearchQuery] = useState("");
      const [rules, setRules] = useState([]);
      const [selectedRuleCategory, setSelectedRuleCategory] = useState("All Categories (24)");
      const [inspectedRule, setInspectedRule] = useState(null);

      // Intake states
      const [selectedPatient, setSelectedPatient] = useState({
        id: "P-1042",
        name: "Sunita Patel",
        gender: "Female",
        age: 58,
        mrn: "#MRN-1042-992",
        primary_complaint: "Chest pain radiating to left arm",
        urgency: "Immediate",
        department: "Cardiology"
      });
      const [patientNarrative, setPatientNarrative] = useState("My chest has been hurting since this morning and I feel like I can't breathe properly.");
      const [isRecording, setIsRecording] = useState(false);
      const [sessionId, setSessionId] = useState("PT-8842-X");
      const [protocolName, setProtocolName] = useState("Chest Pain v4");
      const [confidenceScore, setConfidenceScore] = useState("98.4% High");
      const [questions, setQuestions] = useState([]);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [answeredQuestions, setAnsweredQuestions] = useState([
        {
          question_text: "Are you having difficulty breathing right now?",
          answer: "Yes"
        }
      ]);
      const [whyAskingOpen, setWhyAskingOpen] = useState(false);

      // Triage Evaluation result
      const [triageNote, setTriageNote] = useState(null);

      // Modals
      const [showQuickTriage, setShowQuickTriage] = useState(false);
      const [showEscalatedModal, setShowEscalatedModal] = useState(false);
      const [showSimModal, setShowSimModal] = useState(false);
      const [simData, setSimData] = useState(null);

      // Initial data load
      useEffect(() => {
        fetch("/api/stats").then(r => r.ok ? r.json() : null).then(d => d && setStats(d)).catch(() => {});
        fetch("/api/active-sessions").then(r => r.ok ? r.json() : null).then(d => {
          if (d && d.length > 0) setActiveSessions(d);
        }).catch(() => {});
        fetch("/api/rules").then(r => r.ok ? r.json() : null).then(d => {
          if (d && d.length > 0) {
            setRules(d);
            setInspectedRule(d[0]);
          }
        }).catch(() => {});
      }, []);

      // Start Assessment (Step 1 -> Step 2)
      const handleStartAssessment = async () => {
        if (!patientNarrative.trim()) return;
        try {
          const res = await fetch("/api/intake/understand", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ narrative: patientNarrative })
          });
          if (res.ok) {
            const data = await res.json();
            setSessionId(data.session_id);
            setProtocolName(data.protocol_name);
            setConfidenceScore(data.confidence_score);
            setQuestions(data.questions);
            setCurrentQuestionIdx(0);
            setWorkflowStep(2);
          }
        } catch (e) {
          setWorkflowStep(2);
        }
      };

      // Answer question (Step 2)
      const handleAnswer = (ans) => {
        const q = questions[currentQuestionIdx] || { text: "Did the chest pain begin suddenly?" };
        const updated = [...answeredQuestions, { question_text: q.text, answer: ans }];
        setAnsweredQuestions(updated);

        if (currentQuestionIdx + 1 < (questions.length || 2)) {
          setCurrentQuestionIdx(prev => prev + 1);
        } else {
          setWorkflowStep(3); // Go to Synthesis & Review
        }
      };

      // Proceed from Step 3 -> Step 4 (Evaluate)
      const handleProceedToEvaluation = async () => {
        try {
          const res = await fetch("/api/intake/evaluate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: sessionId,
              patient_narrative: patientNarrative,
              answers: answeredQuestions.map((a, i) => ({ question_id: `q_${i}`, question_text: a.question_text, answer: a.answer }))
            })
          });
          if (res.ok) {
            const note = await res.json();
            setTriageNote(note);
            setWorkflowStep(4);
          }
        } catch (e) {
          setWorkflowStep(4);
        }
      };

      // Voice dictation simulation
      const toggleVoice = () => {
        if (!isRecording) {
          setIsRecording(true);
          setTimeout(() => {
            setPatientNarrative("My chest has been hurting since this morning and I feel like I can't breathe properly. It feels like an elephant is sitting on my chest.");
            setIsRecording(false);
          }, 1500);
        } else {
          setIsRecording(false);
        }
      };

      // Select patient from queue
      const handleSelectSession = (row) => {
        setSelectedPatient({
          id: row.id,
          name: row.patient_name || "Sunita Patel",
          gender: row.gender || "Female",
          age: row.age || 58,
          mrn: `#MRN-${(row.id || '1042').replace('P-', '')}-992`,
          primary_complaint: row.primary_complaint,
          urgency: row.urgency,
          department: row.assigned_department
        });
        setSessionId(row.id);
        setPatientNarrative(row.primary_complaint);
        setAnsweredQuestions([
          {
            question_text: "Are you having difficulty breathing right now?",
            answer: (row.primary_complaint || "").toLowerCase().includes("breath") || (row.primary_complaint || "").toLowerCase().includes("dyspnea") ? "Yes" : "No"
          }
        ]);
        setWorkflowStep(1);
        setCurrentView("workflow");
      };

      // Filtered queue
      const filteredSessions = useMemo(() => {
        return activeSessions.filter(s => {
          const matchesUrgency = (urgencyFilter === "All Urgency Levels" || urgencyFilter === "All") ? true : s.urgency.toLowerCase() === urgencyFilter.toLowerCase();
          const matchesSearch = searchQuery ? (
            s.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.patient_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.primary_complaint.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.assigned_department.toLowerCase().includes(searchQuery.toLowerCase())
          ) : true;
          return matchesUrgency && matchesSearch;
        });
      }, [activeSessions, urgencyFilter, searchQuery]);

      // Filtered rules
      const filteredRules = useMemo(() => {
        if (selectedRuleCategory.startsWith("All")) return rules;
        const cat = selectedRuleCategory.split(" (")[0];
        return rules.filter(r => r.category.toLowerCase() === cat.toLowerCase());
      }, [rules, selectedRuleCategory]);

      return (
        <div className="flex h-screen overflow-hidden bg-[#f8fafc]">
          
          {/* ===================== SIDEBAR (WHITE + CURVY PILLS) ===================== */}

                </div>
              </div>

              {/* Navigation Menu with Curvy Pills */}
              <nav className="px-3 space-y-1 mt-1">
                <button
                  onClick={() => setCurrentView("dashboard")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold transition-all ${
                    currentView === "dashboard"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}

                  <span>Dashboard</span>
                </button>

                <button
                  onClick={() => {
                    setWorkflowStep(1);
                    setCurrentView("workflow");
                  }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold transition-all ${
                    currentView === "workflow"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"

                </button>

                <button

                      ? "bg-[#0f2444] text-white shadow-sm"

                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                  <span>Active Assessments</span>
                  <span className="ml-auto text-[10px] bg-slate-100 px-2 py-0.5 rounded-full font-mono font-bold text-slate-500">14</span>
                </button>

                <button
                  onClick={() => setCurrentView("history")}

                    currentView === "history"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  <span>Triage History</span>
                </button>

                <button

                    currentView === "rules"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                  <span>Rules</span>
                  <span className="ml-auto text-[10px] bg-sky-50 text-sky-700 px-2 py-0.5 rounded-full font-mono font-bold border border-sky-100">24</span>
                </button>

                <button
                  onClick={() => setCurrentView("escalations")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold transition-all ${
                    currentView === "escalations"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                  <span>Escalations</span>
                  <span className="ml-auto text-[10px] bg-rose-50 text-rose-700 px-2 py-0.5 rounded-full font-mono font-bold border border-rose-200">5</span>
                </button>

                <button
                  onClick={() => setCurrentView("analytics")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold transition-all ${
                    currentView === "analytics"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>
                  <span>Analytics</span>
                </button>

                <button
                  onClick={() => alert("System settings configured according to AIIEM Clinical Protocol Board v4.2.")}
                  className="w-full flex items-center gap-3 px-3.5 py-2.5 rounded-2xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  <span>Settings</span>
                </button>
              </nav>
            </div>

            {/* Sidebar Bottom Profile (Curvy Pill) */}

                          className="px-4 py-1.5 bg-rose-600 hover:bg-rose-500 text-white font-semibold rounded-full text-xs transition-all shadow-sm"
                        >
                          Sign-off Review
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </main>
            )}

            {/* TRIAGE HISTORY VIEW */}
            {currentView === "history" && (
              <main className="p-8 max-w-6xl mx-auto w-full space-y-6">
                <div className="pb-3 border-b border-[#e2e8f0]">
                  <h2 className="text-2xl font-bold text-slate-900">Triage History Records</h2>
                  <p className="text-xs text-slate-500 mt-1">Archived intake records with full audit trail and deterministic decision links.</p>
                </div>

                <div className="bg-white rounded-3xl border border-[#e2e8f0] shadow-sm overflow-hidden">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-[#f8fafc] text-slate-500 font-semibold border-b border-slate-100">
                      <tr>
                        <th className="py-3.5 px-5">Case Record</th>
                        <th className="py-3.5 px-5">Patient Profile</th>
                        <th className="py-3.5 px-5">Complaint Track</th>
                        <th className="py-3.5 px-5">Assigned Acuity</th>
                        <th className="py-3.5 px-5">Triggered Rule</th>
                        <th className="py-3.5 px-5">Attending Doctor</th>
                        <th className="py-3.5 px-5 text-right">Audit</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {[
                        { id: "#TR-9021-DX", name: "Devendra Joshi", age: 29, cat: "Abdominal Pain", acuity: "Urgent", rule: "AB-03", doc: "Dr. Sarah Chen" },
                        { id: "#TR-9022-DX", name: "Baby Sneha Reddy", age: 4, cat: "Fever", acuity: "Urgent", rule: "FE-03", doc: "Dr. Sarah Chen" },
                        { id: "#TR-9023-DX", name: "Deepa Chandran", age: 42, cat: "Chest Pain", acuity: "Urgent", rule: "CP-05", doc: "Dr. Sarah Chen" },
                        { id: "#TR-9024-DX", name: "Karthik Swaminathan", age: 26, cat: "Injury", acuity: "Routine", rule: "IN-05", doc: "Dr. Sarah Chen" },
                        { id: "#TR-9025-DX", name: "Suresh Nair", age: 55, cat: "Breathing Difficulty", acuity: "Urgent", rule: "BR-03", doc: "Dr. Sarah Chen" }
                      ].map(h => (
                        <tr key={h.id} className="hover:bg-slate-50">
                          <td className="py-3.5 px-5 font-mono font-bold text-slate-900">{h.id}</td>
                          <td className="py-3.5 px-5 font-semibold text-slate-800">{h.name} ({h.age}y)</td>
                          <td className="py-3.5 px-5 text-slate-600">{h.cat}</td>
                          <td className="py-3.5 px-5">
                            <span className="px-3 py-1 rounded-full font-semibold bg-amber-50 text-amber-800 border border-amber-200">
                              {h.acuity}
                            </span>
                          </td>
                          <td className="py-3.5 px-5 font-mono font-semibold text-sky-600">{h.rule}</td>
                          <td className="py-3.5 px-5 text-slate-600">{h.doc}</td>
                          <td className="py-3.5 px-5 text-right">
                            <button
                              onClick={() => {
                                setPatientNarrative(`Archived case for ${h.name} presenting with acute ${h.cat.toLowerCase()}.`);
                                setCurrentView("note");
                              }}
                              className="text-xs text-sky-600 font-semibold hover:underline"
                            >
                              View Note
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </main>
            )}

            {/* ANALYTICS VIEW */}
            {currentView === "analytics" && (
              <main className="p-8 max-w-6xl mx-auto w-full space-y-6">
                <div className="pb-3 border-b border-[#e2e8f0]">
                  <h2 className="text-2xl font-bold text-slate-900">Clinical Triage Analytics</h2>
                  <p className="text-xs text-slate-500 mt-1">Audit metrics, throughput, and protocol adherence statistics.</p>
                </div>

                <div className="grid grid-cols-3 gap-5">
                  <div className="bg-white rounded-3xl border border-[#e2e8f0] p-6 shadow-sm space-y-4">
                    <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Acuity Distribution</span>
                    <div className="space-y-3 pt-1 text-xs">
                      <div>
                        <div className="flex justify-between font-semibold mb-1">
                          <span className="text-rose-600">Immediate (Level 1)</span>
                          <span>22%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className="bg-rose-600 h-2 rounded-full" style={{ width: "22%" }}></div>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between font-semibold mb-1">
                          <span className="text-amber-600">Urgent (Level 2/3)</span>
                          <span>46%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className="bg-amber-500 h-2 rounded-full" style={{ width: "46%" }}></div>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between font-semibold mb-1">
                          <span className="text-emerald-600">Routine (Level 4/5)</span>
                          <span>32%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className="bg-emerald-600 h-2 rounded-full" style={{ width: "32%" }}></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl border border-[#e2e8f0] p-6 shadow-sm space-y-4">
                    <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Complaint Breakdown</span>
                    <div className="space-y-2 pt-1 text-xs">
                      <div className="flex justify-between py-1 border-b border-slate-50">
                        <span>Chest Pain</span>
                        <span className="font-mono font-bold text-slate-800">28%</span>
                      </div>
                      <div className="flex justify-between py-1 border-b border-slate-50">
                        <span>Breathing Difficulty</span>
                        <span className="font-mono font-bold text-slate-800">24%</span>
                      </div>
                      <div className="flex justify-between py-1 border-b border-slate-50">
                        <span>Physical Injury / Trauma</span>
                        <span className="font-mono font-bold text-slate-800">20%</span>
                      </div>
                      <div className="flex justify-between py-1 border-b border-slate-50">
                        <span>Abdominal Pain</span>
                        <span className="font-mono font-bold text-slate-800">16%</span>
                      </div>
                      <div className="flex justify-between py-1">
                        <span>Fever / Infection</span>
                        <span className="font-mono font-bold text-slate-800">12%</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-3xl border border-[#e2e8f0] p-6 shadow-sm space-y-3">
                    <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Safety & Audit Governance</span>
                    <div className="space-y-3 pt-1 text-xs">
                      <div className="p-3 rounded-2xl bg-emerald-50 text-emerald-800 border border-emerald-100">
                        <strong>100% Rule Grounding:</strong> Zero hallucinations or autonomous diagnoses detected across 4,821 evaluations.
                      </div>
                      <div className="p-3 rounded-2xl bg-sky-50 text-sky-800 border border-sky-100">
                        <strong>Avg Intake Duration:</strong> 2.4 minutes per patient intake.
                      </div>
                    </div>
                  </div>
                </div>
              </main>
            )}

          </div>

          {/* Quick Triage Modal (Curvy 3xl) */}
          {showQuickTriage && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-100">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-sm text-slate-900">Quick Walk-in Triage</h3>
                  <button onClick={() => setShowQuickTriage(false)} className="text-slate-400 hover:text-slate-600">✕</button>
                </div>
                <textarea
                  rows={4}
                  value={patientNarrative}
                  onChange={(e) => setPatientNarrative(e.target.value)}
                  className="w-full p-3.5 text-xs bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none focus:ring-2 focus:ring-sky-500"
                  placeholder="Enter patient complaint..."
                />
                <div className="flex justify-end gap-2 pt-1">
                  <button onClick={() => setShowQuickTriage(false)} className="px-4 py-2 text-xs font-semibold rounded-full text-slate-600 hover:bg-slate-50">Cancel</button>
                  <button
                    onClick={() => {
                      setShowQuickTriage(false);
                      setWorkflowStep(1);
                      setCurrentView("workflow");
                    }}
                    className="px-5 py-2 bg-[#0f2444] text-white text-xs font-semibold rounded-full shadow-sm"
                  >
                    Start Triage →
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Escalation Dispatched Modal (Curvy 3xl) */}
          {showEscalatedModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl max-w-sm w-full p-7 shadow-2xl text-center space-y-3.5 border border-slate-100">
                <div className="w-14 h-14 rounded-full bg-rose-100 text-rose-600 mx-auto flex items-center justify-center text-2xl font-bold">
                  ✔
                </div>
                <h3 className="font-bold text-base text-slate-900">Human Review Dispatched</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  Case escalated to Emergency Triage Unit. Attending Physician Dr. Sarah Chen notified. SLA &lt; 2 mins active.
                </p>
                <button
                  onClick={() => setShowEscalatedModal(false)}
                  className="w-full py-2.5 bg-[#0f2444] text-white text-xs font-bold rounded-full mt-2 shadow-sm"
                >
                  Close
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
