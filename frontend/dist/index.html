<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Healthcare - Patient Intake Triage Assistant | Clinical Core v2.4</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0f7ff',
              100: '#e0effe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              800: '#0c4a6e',
              900: '#082f49',
            },
            sidebar: '#0e1726',
            surface: '#f8fafc',
            clinicalRed: '#dc2626',
            clinicalGreen: '#059669',
            clinicalAmber: '#d97706'
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel Standalone for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Inter Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f1f5f9;
      color: #1e293b;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .mono {
      font-family: 'JetBrains Mono', monospace;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      .print-only {
        display: block !important;
      }
      body {
        background-color: #ffffff;
      }
    }
    /* Custom subtle scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased selection:bg-sky-500 selection:text-white">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // --- ICON COMPONENTS ---
    const Icon = ({ name, className = "w-5 h-5" }) => {
      switch(name) {
        case "dashboard":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>;
        case "new-assessment":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 4v16m8-8H4" /></svg>;
        case "active":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>;
        case "history":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case "rules":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>;
        case "escalations":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        case "analytics":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>;
        case "settings":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>;
        case "search":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>;
        case "bell":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>;
        case "shield":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>;
        case "mic":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" /></svg>;
        case "check":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M5 13l4 4L19 7" /></svg>;
        case "x":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M6 18L18 6M6 6l12 12" /></svg>;
        case "help":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>;
        case "alert":
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
        default:
          return <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor"><circle cx="12" cy="12" r="10" strokeWidth="2" /></svg>;
      }
    };

    function App() {
      // Navigation state
      const [currentView, setCurrentView] = useState("dashboard"); // dashboard, new-assessment, active-assessments, rules, history, escalations, note-view
      const [searchQuery, setSearchQuery] = useState("");
      
      // Data state
      const [stats, setStats] = useState({
        active_assessments: 14,
        awaiting_human_review: 3,
        escalated_today: 5,
        average_intake_time: "2.4m",
        intake_time_delta: "-0.3m"
      });
      const [activeSessions, setActiveSessions] = useState([]);
      const [urgencyFilter, setUrgencyFilter] = useState("All Urgency Levels");
      const [rules, setRules] = useState([]);
      const [selectedRuleCategory, setSelectedRuleCategory] = useState("All Categories (24)");
      const [inspectedRule, setInspectedRule] = useState(null);

      // 4-step assessment workflow state
      const [workflowStep, setWorkflowStep] = useState(1); // 1: Understand, 2: Clarify, 3: Synthesis, 4: Evaluate
      const [patientNarrative, setPatientNarrative] = useState("");
      const [isRecording, setIsRecording] = useState(false);
      const [currentSessionId, setCurrentSessionId] = useState("PT-8842-X");
      const [extractedSymptoms, setExtractedSymptoms] = useState([]);
      const [protocolName, setProtocolName] = useState("Chest Pain v4");
      const [confidenceScore, setConfidenceScore] = useState("98.4% High");
      const [vitalsSnapshot, setVitalsSnapshot] = useState({ spo2: 96, hr: 88, bp: "135/86" });
      const [patientProfile, setPatientProfile] = useState({
        name: "Rajesh Patel",
        age: 58,
        gender: "Male",
        mrn: "#MRN-994-201-831"
      });

      // Follow-up Q&A stream
      const [questions, setQuestions] = useState([]);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [answeredQuestions, setAnsweredQuestions] = useState([]);
      const [showRationale, setShowRationale] = useState(false);

      // Triage note result
      const [triageNote, setTriageNote] = useState(null);

      // Modals
      const [showQuickTriage, setShowQuickTriage] = useState(false);
      const [showEscalationModal, setShowEscalationModal] = useState(false);
      const [escalationSuccessMsg, setEscalationSuccessMsg] = useState("");
      const [showRuleSimModal, setShowRuleSimModal] = useState(false);
      const [simResult, setSimResult] = useState(null);

      // Load initial backend data
      useEffect(() => {
        fetchStats();
        fetchActiveSessions();
        fetchRules();
      }, []);

      const fetchStats = async () => {
        try {
          const res = await fetch("/api/stats");
          if (res.ok) {
            const d = await res.json();
            setStats(d);
          }
        } catch (e) {
          console.log("Using cached stats", e);
        }
      };

      const fetchActiveSessions = async () => {
        try {
          const res = await fetch("/api/active-sessions");
          if (res.ok) {
            const d = await res.json();
            setActiveSessions(d);
          }
        } catch (e) {
          console.log("Using cached sessions", e);
        }
      };

      const fetchRules = async () => {
        try {
          const res = await fetch("/api/rules");
          if (res.ok) {
            const d = await res.json();
            setRules(d);
            if (d.length > 0) setInspectedRule(d[0]);
          }
        } catch (e) {
          console.log("Using cached rules", e);
        }
      };

      // Voice dictation toggle
      const toggleVoiceDictation = () => {
        if (!isRecording) {
          setIsRecording(true);
          // Simulate clinical speech-to-text intake
          setTimeout(() => {
            setPatientNarrative("My chest has been hurting since this morning and I feel like I cannot breathe properly. It feels like a heavy weight.");
            setIsRecording(false);
          }, 1800);
        } else {
          setIsRecording(false);
        }
      };

      // Handle Quick symptom chip click in Step 1
      const addSymptomChip = (sym) => {
        if (!patientNarrative.includes(sym)) {
          setPatientNarrative(prev => prev ? `${prev} Also having ${sym.toLowerCase()}.` : `Patient presents with ${sym.toLowerCase()}.`);
        }
      };

      // Start assessment (Transition Step 1 -> Step 2)
      const handleStartAssessment = async () => {
        if (!patientNarrative.trim()) return;
        try {
          const res = await fetch("/api/intake/understand", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              narrative: patientNarrative,
              patient_name: patientProfile.name,
              age: patientProfile.age,
              gender: patientProfile.gender
            })
          });
          if (res.ok) {
            const data = await res.json();
            setCurrentSessionId(data.session_id);
            setExtractedSymptoms(data.extracted_symptoms);
            setProtocolName(data.protocol_name);
            setConfidenceScore(data.confidence_score);
            setQuestions(data.questions);
            setCurrentQuestionIdx(0);
            setAnsweredQuestions([]);
            setWorkflowStep(2);
          }
        } catch (err) {
          console.error("Error understanding narrative", err);
          setWorkflowStep(2);
        }
      };

      // Answer a question in Step 2
      const handleAnswerQuestion = (ans) => {
        const currentQ = questions[currentQuestionIdx];
        const newAns = {
          question_id: currentQ.id,
          question_text: currentQ.text,
          answer: ans,
          target_rule_risk: currentQ.target_rule_risk
        };
        const updatedAnswers = [...answeredQuestions, newAns];
        setAnsweredQuestions(updatedAnswers);

        if (currentQuestionIdx + 1 < questions.length) {
          setCurrentQuestionIdx(prev => prev + 1);
        } else {
          // All questions answered, transition to Step 3: Synthesis
          setWorkflowStep(3);
        }
      };

      // Transition Step 3 -> Step 4: Evaluate Triage Result
      const handleProceedToEvaluation = async () => {
        try {
          const res = await fetch("/api/intake/evaluate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: currentSessionId,
              patient_narrative: patientNarrative,
              patient_name: patientProfile.name,
              age: patientProfile.age,
              gender: patientProfile.gender,
              mrn: patientProfile.mrn,
              answers: answeredQuestions,
              vitals: vitalsSnapshot
            })
          });
          if (res.ok) {
            const note = await res.json();
            setTriageNote(note);
            setWorkflowStep(4);
          }
        } catch (e) {
          console.error("Evaluation error", e);
        }
      };

      // Escalate to human reviewer
      const handleEscalateHuman = async () => {
        try {
          const res = await fetch("/api/escalate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: currentSessionId,
              patient_name: patientProfile.name,
              target_department: triageNote ? triageNote.target_department : "Emergency Triage Unit",
              urgency: triageNote ? triageNote.urgency_level : "Immediate",
              attending_clinician: "Dr. Sarah Chennupati, MD"
            })
          });
          if (res.ok) {
            const d = await res.json();
            setEscalationSuccessMsg(d.message);
            setShowEscalationModal(true);
          }
        } catch (e) {
          setEscalationSuccessMsg(`Case ${currentSessionId} escalated to Emergency Triage Unit.`);
          setShowEscalationModal(true);
        }
      };

      // Test rule against simulator
      const runRuleSimulator = (rule) => {
        setSimResult({
          rule_id: rule.id,
          test_case: `Synthetic Patient: 55yo reporting acute ${rule.category.toLowerCase()} presentation`,
          match_outcome: "DETERMINISTIC TRIGGER POSITIVE",
          routed_acuity: rule.priority,
          sla_compliance: "PASSED (< 1.2s evaluation cycle)"
        });
        setShowRuleSimModal(true);
      };

      // Filtered active queue
      const filteredSessions = useMemo(() => {
        return activeSessions.filter(s => {
          const matchesUrgency = (urgencyFilter === "All Urgency Levels" || urgencyFilter === "All") ? true : s.urgency.toLowerCase() === urgencyFilter.toLowerCase();
          const matchesSearch = searchQuery ? (
            s.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.patient_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.primary_complaint.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.assigned_department.toLowerCase().includes(searchQuery.toLowerCase())
          ) : true;
          return matchesUrgency && matchesSearch;
        });
      }, [activeSessions, urgencyFilter, searchQuery]);

      // Filtered rules
      const filteredRules = useMemo(() => {
        if (selectedRuleCategory.startsWith("All")) return rules;
        const catName = selectedRuleCategory.split(" (")[0];
        return rules.filter(r => r.category.toLowerCase() === catName.toLowerCase());
      }, [rules, selectedRuleCategory]);

      return (
        <div className="flex h-screen overflow-hidden">
          
          {/* ===================== SIDEBAR ===================== */}
          <aside className="w-64 bg-sidebar text-slate-300 flex flex-col justify-between flex-shrink-0 z-20 shadow-xl select-none">
            <div>
              {/* Logo & Branding */}
              <div className="p-5 flex items-center gap-3 border-b border-slate-800/80">
                <div className="w-9 h-9 rounded-lg bg-sky-600 flex items-center justify-center text-white font-bold text-lg shadow-md shadow-sky-600/30">
                  Ai
                </div>
                <div>
                  <h1 className="text-white font-semibold tracking-tight text-base">TriageAI</h1>
                  <p className="text-xs text-slate-400 font-mono">Clinical Core v2.4</p>
                </div>
              </div>

              {/* Navigation Items */}
              <nav className="p-3 space-y-1">
                <button
                  onClick={() => setCurrentView("dashboard")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${currentView === "dashboard" ? "bg-slate-800 text-white font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                >
                  <Icon name="dashboard" className="w-4 h-4 text-sky-400" />
                  Dashboard
                </button>

                <button
                  onClick={() => {
                    setWorkflowStep(1);
                    setCurrentView("new-assessment");
                  }}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${currentView === "new-assessment" ? "bg-slate-800 text-white font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                >
                  <Icon name="new-assessment" className="w-4 h-4 text-emerald-400" />
                  New Assessment
                </button>

                <button
                  onClick={() => setCurrentView("active-assessments")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${currentView === "active-assessments" ? "bg-slate-800 text-white font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                >
                  <Icon name="active" className="w-4 h-4 text-indigo-400" />
                  Active Assessments
                  <span className="ml-auto text-xs bg-slate-800 px-2 py-0.5 rounded-full text-slate-300 font-mono">14</span>
                </button>

                <button
                  onClick={() => setCurrentView("history")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${currentView === "history" ? "bg-slate-800 text-white font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                >
                  <Icon name="history" className="w-4 h-4 text-amber-400" />
                  Triage History
                </button>

                <button
                  onClick={() => setCurrentView("rules")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${currentView === "rules" ? "bg-slate-800 text-white font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                >
                  <Icon name="rules" className="w-4 h-4 text-cyan-400" />
                  Rules
                  <span className="ml-auto text-xs bg-sky-950 text-sky-400 px-2 py-0.5 rounded-full font-mono border border-sky-800">24</span>
                </button>

                <button
                  onClick={() => setCurrentView("escalations")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${currentView === "escalations" ? "bg-slate-800 text-white font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                >
                  <Icon name="escalations" className="w-4 h-4 text-rose-400" />
                  Escalations
                  <span className="ml-auto text-xs bg-rose-950 text-rose-300 px-2 py-0.5 rounded-full font-mono border border-rose-800">5</span>
                </button>

                <button
                  onClick={() => setCurrentView("analytics")}
                  className={`w-full flex items-center gap-3 px-3.5 py-2.5 rounded-lg text-sm font-medium transition-colors ${currentView === "analytics" ? "bg-slate-800 text-white font-semibold" : "text-slate-400 hover:text-slate-200 hover:bg-slate-800/50"}`}
                >
                  <Icon name="analytics" className="w-4 h-4 text-purple-400" />
                  Analytics
                </button>
              </nav>
            </div>

            {/* Clinician Profile Footer */}
            <div className="p-4 border-t border-slate-800 space-y-3">
              <div className="flex items-center gap-2 text-xs text-slate-400 hover:text-slate-200 cursor-pointer">
                <Icon name="shield" className="w-4 h-4 text-emerald-400" />
                <span>Help & Clinical Safety</span>
              </div>
              <div className="flex items-center gap-3 p-2 rounded-lg bg-slate-800/60 border border-slate-700/50">
                <div className="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center text-slate-200 font-semibold text-xs border border-slate-600">
                  SC
                </div>
                <div className="overflow-hidden">
                  <div className="text-sm font-medium text-white truncate">Dr. Sarah Chennupati</div>
                  <div className="text-xs text-slate-400 truncate">Attending Physician</div>
                </div>
              </div>
            </div>
          </aside>

                  <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-2">
                    <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Acuity Distribution</span>
                    <div className="space-y-2 pt-2 text-xs">
                      <div>
                        <div className="flex justify-between font-semibold mb-1">
                          <span className="text-rose-600">Immediate (Level 1)</span>
                          <span>22%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className="bg-rose-600 h-2 rounded-full" style={{ width: "22%" }}></div>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between font-semibold mb-1">
                          <span className="text-amber-600">Urgent (Level 2/3)</span>
                          <span>46%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className="bg-amber-500 h-2 rounded-full" style={{ width: "46%" }}></div>
                        </div>
                      </div>
                      <div>
                        <div className="flex justify-between font-semibold mb-1">
                          <span className="text-emerald-600">Routine (Level 4/5)</span>
                          <span>32%</span>
                        </div>
                        <div className="w-full bg-slate-100 rounded-full h-2">
                          <div className="bg-emerald-600 h-2 rounded-full" style={{ width: "32%" }}></div>
                        </div>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-2">
                    <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Complaint Breakdown</span>
                    <div className="space-y-1.5 pt-2 text-xs">
                      <div className="flex justify-between py-1 border-b border-slate-50">
                        <span>Chest Pain</span>
                        <span className="font-mono font-bold text-slate-800">28%</span>
                      </div>
                      <div className="flex justify-between py-1 border-b border-slate-50">
                        <span>Breathing Difficulty</span>
                        <span className="font-mono font-bold text-slate-800">24%</span>
                      </div>
                      <div className="flex justify-between py-1 border-b border-slate-50">
                        <span>Physical Injury / Trauma</span>
                        <span className="font-mono font-bold text-slate-800">20%</span>
                      </div>
                      <div className="flex justify-between py-1 border-b border-slate-50">
                        <span>Abdominal Pain</span>
                        <span className="font-mono font-bold text-slate-800">16%</span>
                      </div>
                      <div className="flex justify-between py-1">
                        <span>Fever / Infection</span>
                        <span className="font-mono font-bold text-slate-800">12%</span>
                      </div>
                    </div>
                  </div>

                  <div className="bg-white rounded-xl border border-slate-200 p-5 shadow-sm space-y-2">
                    <span className="text-xs text-slate-400 font-semibold uppercase tracking-wider">Safety & Audit Governance</span>
                    <div className="space-y-2 pt-2 text-xs">
                      <div className="p-2.5 rounded bg-emerald-50 text-emerald-800 border border-emerald-100">
                        <strong>100% Rule Grounding:</strong> Zero hallucinations or autonomous diagnoses detected across 4,821 evaluations.
                      </div>
                      <div className="p-2.5 rounded bg-sky-50 text-sky-800 border border-sky-100">
                        <strong>Avg Intake Duration:</strong> 2.4 minutes per patient intake.
                      </div>
                    </div>
                  </div>
                </div>
              </main>
            )}

            {/* ===================== TRIAGE HISTORY VIEW ===================== */}
            {currentView === "history" && (
              <main className="p-8 max-w-6xl mx-auto w-full space-y-6">
                <div className="pb-3 border-b border-slate-200">
                  <h2 className="text-2xl font-bold text-slate-900">Triage Intake History</h2>
                  <p className="text-xs text-slate-500 mt-1">Archived intake records with full audit trail and deterministic decision links.</p>
                </div>

                <div className="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                  <table className="w-full text-left text-xs">
                    <thead className="bg-slate-50 text-slate-500 uppercase tracking-wider font-semibold border-b border-slate-100">
                      <tr>
                        <th className="py-3 px-4">Case Record</th>
                        <th className="py-3 px-4">Patient Profile</th>
                        <th className="py-3 px-4">Complaint Track</th>
                        <th className="py-3 px-4">Assigned Acuity</th>
                        <th className="py-3 px-4">Triggered Rule</th>
                        <th className="py-3 px-4">Attending Doctor</th>
                        <th className="py-3 px-4 text-right">Audit</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {[
                        { id: "#TR-9021-DX", name: "Devendra Joshi", age: 29, cat: "Abdominal Pain", acuity: "Urgent", rule: "AB-03", doc: "Dr. Sarah Chennupati" },
                        { id: "#TR-9022-DX", name: "Baby Sneha Reddy", age: 4, cat: "Fever", acuity: "Urgent", rule: "FE-03", doc: "Dr. Kavita Narayanan" },
                        { id: "#TR-9023-DX", name: "Deepa Chandran", age: 42, cat: "Chest Pain", acuity: "Urgent", rule: "CP-05", doc: "Dr. Ananya Iyer" },
                        { id: "#TR-9024-DX", name: "Karthik Swaminathan", age: 26, cat: "Injury", acuity: "Routine", rule: "IN-05", doc: "Dr. Rajesh Sharma" },
                        { id: "#TR-9025-DX", name: "Suresh Nair", age: 55, cat: "Breathing Difficulty", acuity: "Urgent", rule: "BR-03", doc: "Dr. Priya Nair" }
                      ].map(h => (
                        <tr key={h.id} className="hover:bg-slate-50">
                          <td className="py-3 px-4 font-mono font-bold text-slate-900">{h.id}</td>
                          <td className="py-3 px-4 font-semibold text-slate-800">{h.name} ({h.age}y)</td>
                          <td className="py-3 px-4 text-slate-600">{h.cat}</td>
                          <td className="py-3 px-4">
                            <span className="px-2 py-0.5 rounded font-semibold bg-amber-50 text-amber-800 border border-amber-200">
                              {h.acuity}
                            </span>
                          </td>
                          <td className="py-3 px-4 font-mono font-semibold text-sky-600">{h.rule}</td>
                          <td className="py-3 px-4 text-slate-600">{h.doc}</td>
                          <td className="py-3 px-4 text-right">
                            <button
                              onClick={() => {
                                setPatientNarrative(`Archived case for ${h.name} presenting with acute ${h.cat.toLowerCase()}.`);
                                setCurrentView("note-view");
                              }}
                              className="text-xs text-sky-600 font-semibold hover:underline"
                            >
                              View Note
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </main>
            )}

          </div>

          {/* ===================== QUICK TRIAGE MODAL ===================== */}
          {showQuickTriage && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <div className="flex items-center gap-2">
                    <span className="w-8 h-8 rounded-lg bg-sky-600 text-white flex items-center justify-center font-bold text-sm">
                      ⚡
                    </span>
                    <h3 className="font-bold text-base text-slate-900">Quick Triage Walk-in Intake</h3>
                  </div>
                  <button
                    onClick={() => setShowQuickTriage(false)}
                    className="text-slate-400 hover:text-slate-600 font-bold text-lg"
                  >
                    ✕
                  </button>
                </div>

                <div className="space-y-3 text-xs">
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Patient Name</label>
                    <input
                      type="text"
                      defaultValue="Rajesh Patel"
                      onChange={(e) => setPatientProfile(prev => ({ ...prev, name: e.target.value }))}
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">Age</label>
                      <input
                        type="number"
                        defaultValue="58"
                        onChange={(e) => setPatientProfile(prev => ({ ...prev, age: parseInt(e.target.value) || 30 }))}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                      />
                    </div>
                    <div>
                      <label className="font-semibold text-slate-700 block mb-1">Gender</label>
                      <select
                        defaultValue="Male"
                        onChange={(e) => setPatientProfile(prev => ({ ...prev, gender: e.target.value }))}
                        className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                      >
                        <option>Male</option>
                        <option>Female</option>
                        <option>Other</option>
                      </select>
                    </div>
                  </div>
                  <div>
                    <label className="font-semibold text-slate-700 block mb-1">Patient Complaint / Description</label>
                    <textarea
                      rows={3}
                      placeholder="e.g. Sharp pain in lower right abdomen since this morning..."
                      onChange={(e) => setPatientNarrative(e.target.value)}
                      className="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg"
                    />
                  </div>
                </div>

                <div className="pt-2 flex justify-end gap-2">
                  <button
                    onClick={() => setShowQuickTriage(false)}
                    className="px-4 py-2 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => {
                      setShowQuickTriage(false);
                      setWorkflowStep(1);
                      setCurrentView("new-assessment");
                    }}
                    className="px-5 py-2 rounded-lg bg-slate-900 hover:bg-slate-800 text-white text-xs font-semibold"
                  >
                    Proceed to Assessment →
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ===================== HUMAN ESCALATION MODAL ===================== */}
          {showEscalationModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 text-center">
                <div className="w-14 h-14 rounded-full bg-rose-100 text-rose-600 mx-auto flex items-center justify-center text-2xl font-bold">
                  ✓
                </div>
                <h3 className="font-bold text-lg text-slate-900">Human Escalation Dispatched</h3>
                <p className="text-xs text-slate-600 leading-relaxed">
                  {escalationSuccessMsg || "Case successfully transferred to Emergency Triage Unit. Attending physician Dr. Sarah Chennupati notified."}
                </p>
                <div className="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs font-mono text-slate-500">
                  Escalation SLA: &lt; 2 mins response time active
                </div>
                <button
                  onClick={() => setShowEscalationModal(false)}
                  className="w-full py-2.5 rounded-xl bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold"
                >
                  Return to Dashboard
                </button>
              </div>
            </div>
          )}

          {/* ===================== RULE SIMULATOR MODAL ===================== */}
          {showRuleSimModal && simResult && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                  <h3 className="font-bold text-sm text-slate-900">Simulator Output: Rule {simResult.rule_id}</h3>
                  <button onClick={() => setShowRuleSimModal(false)} className="text-slate-400">✕</button>
                </div>
                <div className="space-y-2 text-xs">
                  <div className="p-2.5 bg-slate-50 rounded-lg border border-slate-200">
                    <span className="text-slate-400 block text-[10px]">Test Case</span>
                    <span className="font-semibold text-slate-800">{simResult.test_case}</span>
                  </div>
                  <div className="p-2.5 bg-emerald-50 text-emerald-800 rounded-lg border border-emerald-200">
                    <span className="block text-[10px] font-bold">Execution Status</span>
                    <span className="font-semibold font-mono">{simResult.match_outcome}</span>
                  </div>
                  <div className="p-2.5 bg-slate-50 rounded-lg border border-slate-200">
                    <span className="text-slate-400 block text-[10px]">Deterministic Acuity & SLA</span>
                    <span className="font-semibold text-slate-800">{simResult.routed_acuity} • {simResult.sla_compliance}</span>
                  </div>
                </div>
                <button
                  onClick={() => setShowRuleSimModal(false)}
                  className="w-full py-2 rounded-lg bg-slate-900 text-white text-xs font-bold"
                >
                  Close Simulator
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
