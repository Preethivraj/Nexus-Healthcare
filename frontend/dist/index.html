<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriageAI - Clinical Core v2.4</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            appNavy: '#0c2340',
            appDark: '#081729',
            activeNav: '#0f2444',
            lightBg: '#f8fafc',
            borderLight: '#e2e8f0',
            textPrimary: '#0f172a',
            textSecondary: '#64748b',
            alertRedBg: '#fee2e2',
            alertRedText: '#b91c1c'
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['JetBrains Mono', 'Menlo', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & ReactDOM -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="bg-[#f8fafc]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    function App() {
      // Main navigation view: 'dashboard', 'workflow', 'rules', 'history', 'escalations', 'note'
      const [currentView, setCurrentView] = useState("dashboard");
      
      // 4-Step Clinical Triage Workflow: 1 (Understand), 2 (Clarify), 3 (Synthesis), 4 (Evaluate)
      const [workflowStep, setWorkflowStep] = useState(1);

      // Data states
      const [stats, setStats] = useState({
        active_assessments: 14,
        awaiting_human_review: 3,
        escalated_today: 5,
        average_intake_time: "2.4m",
        intake_time_delta: "-0.3m"
      });
      const [activeSessions, setActiveSessions] = useState([]);
      const [urgencyFilter, setUrgencyFilter] = useState("All Urgency Levels");
      const [searchQuery, setSearchQuery] = useState("");
      const [rules, setRules] = useState([]);
      const [selectedRuleCategory, setSelectedRuleCategory] = useState("All Categories (24)");
      const [inspectedRule, setInspectedRule] = useState(null);

      // Intake states
      const [patientNarrative, setPatientNarrative] = useState("My chest has been hurting since this morning and I feel like I can't breathe properly.");
      const [isRecording, setIsRecording] = useState(false);
      const [sessionId, setSessionId] = useState("PT-8842-X");
      const [protocolName, setProtocolName] = useState("Chest Pain v4");
      const [confidenceScore, setConfidenceScore] = useState("98.4% High");
      const [questions, setQuestions] = useState([]);
      const [currentQuestionIdx, setCurrentQuestionIdx] = useState(0);
      const [answeredQuestions, setAnsweredQuestions] = useState([
        {
          question_text: "Are you having difficulty breathing right now?",
          answer: "Yes"
        }
      ]);
      const [whyAskingOpen, setWhyAskingOpen] = useState(false);

      // Triage Evaluation result
      const [triageNote, setTriageNote] = useState(null);

      // Modals
      const [showQuickTriage, setShowQuickTriage] = useState(false);
      const [showEscalatedModal, setShowEscalatedModal] = useState(false);

      // Load initial backend data
      useEffect(() => {
        fetch("/api/stats").then(r => r.ok ? r.json() : null).then(d => d && setStats(d)).catch(() => {});
        fetch("/api/active-sessions").then(r => r.ok ? r.json() : null).then(d => d && setActiveSessions(d)).catch(() => {});
        fetch("/api/rules").then(r => r.ok ? r.json() : null).then(d => {
          if (d && d.length > 0) {
            setRules(d);
            setInspectedRule(d[0]);
          }
        }).catch(() => {});
      }, []);

      // Start Assessment (Step 1 -> Step 2)
      const handleStartAssessment = async () => {
        if (!patientNarrative.trim()) return;
        try {
          const res = await fetch("/api/intake/understand", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ narrative: patientNarrative })
          });
          if (res.ok) {
            const data = await res.json();
            setSessionId(data.session_id);
            setProtocolName(data.protocol_name);
            setConfidenceScore(data.confidence_score);
            setQuestions(data.questions);
            setCurrentQuestionIdx(0);
            setWorkflowStep(2);
          }
        } catch (e) {
          setWorkflowStep(2);
        }
      };

      // Answer question (Step 2)
      const handleAnswer = (ans) => {
        const q = questions[currentQuestionIdx] || { text: "Did the chest pain begin suddenly?" };
        const updated = [...answeredQuestions, { question_text: q.text, answer: ans }];
        setAnsweredQuestions(updated);

        if (currentQuestionIdx + 1 < (questions.length || 2)) {
          setCurrentQuestionIdx(prev => prev + 1);
        } else {
          setWorkflowStep(3); // Go to Synthesis & Review
        }
      };

      // Proceed from Step 3 -> Step 4 (Evaluate)
      const handleProceedToEvaluation = async () => {
        try {
          const res = await fetch("/api/intake/evaluate", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              session_id: sessionId,
              patient_narrative: patientNarrative,
              answers: answeredQuestions.map((a, i) => ({ question_id: `q_${i}`, question_text: a.question_text, answer: a.answer }))
            })
          });
          if (res.ok) {
            const note = await res.json();
            setTriageNote(note);
            setWorkflowStep(4);
          }
        } catch (e) {
          setWorkflowStep(4);
        }
      };

      // Voice dictation simulation
      const toggleVoice = () => {
        if (!isRecording) {
          setIsRecording(true);
          setTimeout(() => {
            setPatientNarrative("My chest has been hurting since this morning and I feel like I can't breathe properly. It feels like an elephant is sitting on my chest.");
            setIsRecording(false);
          }, 1500);
        } else {
          setIsRecording(false);
        }
      };

      // Filtered sessions
      const filteredSessions = useMemo(() => {
        return activeSessions.filter(s => {
          const matchesUrgency = (urgencyFilter === "All Urgency Levels" || urgencyFilter === "All") ? true : s.urgency.toLowerCase() === urgencyFilter.toLowerCase();
          const matchesSearch = searchQuery ? (
            s.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.patient_name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.primary_complaint.toLowerCase().includes(searchQuery.toLowerCase()) ||
            s.assigned_department.toLowerCase().includes(searchQuery.toLowerCase())
          ) : true;
          return matchesUrgency && matchesSearch;
        });
      }, [activeSessions, urgencyFilter, searchQuery]);

      // Filtered rules
      const filteredRules = useMemo(() => {
        if (selectedRuleCategory.startsWith("All")) return rules;
        const cat = selectedRuleCategory.split(" (")[0];
        return rules.filter(r => r.category.toLowerCase() === cat.toLowerCase());
      }, [rules, selectedRuleCategory]);

      return (
        <div className="flex h-screen overflow-hidden bg-[#f8fafc]">
          
          {/* ===================== SIDEBAR (WHITE BACKGROUND - EXACT TO MOCKUPS) ===================== */}
          <aside className="w-56 bg-white text-slate-700 flex flex-col justify-between flex-shrink-0 z-20 border-r border-[#e2e8f0] select-none">
            <div>
              {/* Brand Header */}
              <div className="p-5 flex items-center gap-3">
                <div className="w-8 h-8 rounded-lg bg-[#0b1b30] flex items-center justify-center text-white font-bold text-sm tracking-wide shadow-sm">
                  Ai
                </div>
                <div>
                  <h1 className="text-slate-900 font-bold text-sm leading-tight">TriageAI</h1>
                  <p className="text-[11px] text-slate-400 font-normal">Clinical Core v2.4</p>
                </div>
              </div>

              {/* Navigation Menu (White with Dark Navy Active Pill) */}
              <nav className="px-3 space-y-1 mt-1">
                {/* Dashboard Button */}
                <button
                  onClick={() => setCurrentView("dashboard")}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                    currentView === "dashboard"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M5 3a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2V5a2 2 0 00-2-2H5zM5 11a2 2 0 00-2 2v2a2 2 0 002 2h2a2 2 0 002-2v-2a2 2 0 00-2-2H5zM11 5a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V5zM11 13a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" /></svg>
                  <span>Dashboard</span>
                </button>

                {/* New Assessment Button */}
                <button
                  onClick={() => {
                    setWorkflowStep(1);
                    setCurrentView("workflow");
                  }}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                    currentView === "workflow"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 4v16m8-8H4" /></svg>
                  <span>New Assessment</span>
                </button>

                {/* Active Assessments */}
                <button
                  onClick={() => setCurrentView("active-assessments")}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                    currentView === "active-assessments"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
                  <span>Active Assessments</span>
                </button>

                {/* Triage History */}
                <button
                  onClick={() => setCurrentView("history")}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                    currentView === "history"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                  <span>Triage History</span>
                </button>

                {/* Rules */}
                <button
                  onClick={() => setCurrentView("rules")}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                    currentView === "rules"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" /></svg>
                  <span>Rules</span>
                </button>

                {/* Escalations */}
                <button
                  onClick={() => setCurrentView("escalations")}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                    currentView === "escalations"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>
                  <span>Escalations</span>
                </button>

                {/* Analytics */}
                <button
                  onClick={() => setCurrentView("analytics")}
                  className={`w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold transition-all ${
                    currentView === "analytics"
                      ? "bg-[#0f2444] text-white shadow-sm"
                      : "text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                  }`}
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M7 12l3-3 3 3 4-4M8 21l4-4 4 4M3 4h18M4 4h16v12a1 1 0 01-1 1H5a1 1 0 01-1-1V4z" /></svg>
                  <span>Analytics</span>
                </button>

                {/* Settings */}
                <button
                  onClick={() => alert("Settings locked under Governance Revision 4.2.")}
                  className="w-full flex items-center gap-3 px-3 py-2 rounded-xl text-xs font-semibold text-slate-600 hover:text-slate-900 hover:bg-slate-50"
                >
                  <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" /><path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>
                  <span>Settings</span>
                </button>
              </nav>
            </div>

            {/* Sidebar Bottom Profile (Exact Light Card) */}
            <div className="p-3 space-y-2 border-t border-[#e2e8f0]">
              <div className="flex items-center gap-2 text-xs text-slate-500 px-2 py-1 cursor-pointer hover:text-slate-800">
                <svg className="w-3.5 h-3.5 text-slate-400" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 16v-4m0-4h.01" /></svg>
                <span>Help & Safety</span>
              </div>
              <div className="flex items-center gap-3 p-2.5 rounded-xl bg-[#f1f5f9] text-slate-900">
                <div className="w-8 h-8 rounded-full bg-[#0f2444] flex items-center justify-center text-white text-xs font-semibold">
                  SC
                </div>
                <div className="overflow-hidden">
                  <div className="text-xs font-bold text-slate-900 leading-tight">Dr. Sarah Chen</div>
                  <div className="text-[10px] text-slate-500 leading-tight">Attending Physician</div>
                </div>
              </div>
            </div>
          </aside>

          {/* ===================== MAIN CONTENT CANVAS ===================== */}
          <div className="flex-1 flex flex-col h-screen overflow-y-auto">
            
            {/* Top Bar (Exact to Mockups) */}
            <header className="sticky top-0 z-10 bg-white border-b border-[#e2e8f0] px-8 py-3 flex items-center justify-between">
              <div className="w-96">
                <div className="relative">
                  <span className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-400">
                    <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                  </span>
                  <input
                    type="text"
                    placeholder="Search patient ID, acuity, or symptoms..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-1.5 text-xs bg-[#f8fafc] border border-slate-200 rounded-lg focus:outline-none focus:ring-1 focus:ring-sky-500 focus:bg-white text-slate-700 placeholder:text-slate-400"
                  />
                </div>
              </div>

              <div className="flex items-center gap-3">
                <button
                  onClick={() => setShowQuickTriage(true)}
                  className="bg-[#0f2444] hover:bg-[#09182d] text-white text-xs font-semibold px-4 py-1.5 rounded-lg shadow-sm flex items-center gap-1.5"
                >
                  <span>+ Quick Triage</span>
                </button>
                <div className="relative p-1 text-slate-400 hover:text-slate-700 cursor-pointer">
                  <svg className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" /></svg>
                  <span className="absolute top-1 right-1 w-2 h-2 bg-rose-500 rounded-full ring-2 ring-white"></span>
                </div>
              </div>
            </header>

            {/* ===================== DASHBOARD VIEW (IMAGE 5 IN USER UPLOAD) ===================== */}
            {currentView === "dashboard" && (
              <main className="p-8 max-w-6xl mx-auto w-full space-y-6">
                
                {/* Greeting & Action Header */}
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-xl font-bold text-slate-900 tracking-tight">Good morning, Sarah</h2>
                    <p className="text-xs text-slate-500 mt-0.5">Let's make every patient intake safer and clearer.</p>
                  </div>
                  <button
                    onClick={() => {
                      setWorkflowStep(1);
                      setCurrentView("workflow");
                    }}
                    className="bg-[#0f2444] hover:bg-[#09182d] text-white text-xs font-semibold px-4 py-2 rounded-xl shadow-sm"
                  >
                    + New Patient Assessment
                  </button>
                </div>

                {/* 4 Metric Cards (Image 5) */}
                <div className="grid grid-cols-4 gap-4">
                  {/* Card 1 */}
                  <div className="bg-white p-4 rounded-2xl border border-[#e2e8f0] shadow-sm flex justify-between items-start">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-500">Active Assessments</div>
                      <div className="text-xl font-bold text-slate-900 mt-2 font-mono">{stats.active_assessments}</div>
                      <div className="text-[11px] font-medium text-sky-600 mt-1">↑+2% from hr</div>
                    </div>
                    <div className="w-8 h-8 rounded-lg bg-[#0f2444] text-white flex items-center justify-center">
                      <svg className="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path d="M2 10a8 8 0 018-8v8h8a8 8 0 11-16 0z" /></svg>
                    </div>
                  </div>

                  {/* Card 2 */}
                  <div className="bg-[#fef2f2] p-4 rounded-2xl border border-rose-100 shadow-sm flex justify-between items-start">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-600">Awaiting Human Review</div>
                      <div className="text-xl font-bold text-rose-600 mt-2 font-mono">{stats.awaiting_human_review}</div>
                      <div className="text-[11px] font-semibold text-rose-500 mt-1">Requires attention</div>
                    </div>
                    <div className="w-8 h-8 rounded-lg bg-rose-100 text-rose-600 flex items-center justify-center font-bold">
                      ▲
                    </div>
                  </div>

                  {/* Card 3 */}
                  <div className="bg-[#f0f9ff] p-4 rounded-2xl border border-sky-100 shadow-sm flex justify-between items-start">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-600">Escalated Today</div>
                      <div className="text-xl font-bold text-slate-900 mt-2 font-mono">{stats.escalated_today}</div>
                      <div className="text-[11px] font-medium text-slate-500 mt-1">Stable flow</div>
                    </div>
                    <div className="w-8 h-8 rounded-lg bg-sky-100 text-sky-700 flex items-center justify-center font-bold">
                      !
                    </div>
                  </div>

                  {/* Card 4 */}
                  <div className="bg-white p-4 rounded-2xl border border-[#e2e8f0] shadow-sm flex justify-between items-start">
                    <div>
                      <div className="text-[11px] font-semibold text-slate-500">Average Intake Time</div>
                      <div className="text-xl font-bold text-slate-900 mt-2 font-mono">{stats.average_intake_time}</div>
                      <div className="text-[11px] font-medium text-slate-500 mt-1">↓ {stats.intake_time_delta}</div>
                    </div>
                    <div className="w-8 h-8 rounded-lg bg-slate-100 text-slate-600 flex items-center justify-center">
                      <svg className="w-4 h-4" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M12 6v6l4 2" /></svg>
                    </div>
                  </div>
                </div>

                {/* Active Assessments Table (Image 5) */}
                <div className="bg-white rounded-2xl border border-[#e2e8f0] shadow-sm overflow-hidden">
                  <div className="p-4 border-b border-slate-100 flex items-center justify-between">
                    <div>
                      <h3 className="font-bold text-slate-900 text-sm">Active Assessments</h3>
                      <p className="text-[11px] text-slate-400">Real-time clinical triage stream and queue management.</p>

                      </div>
                    </div>
                    <div className="p-4 bg-slate-50 rounded-xl border border-slate-100 space-y-2">
                      <span className="text-[10px] font-bold uppercase text-slate-400 tracking-wider block">VERBATIM INPUT</span>
                      <h4 className="text-xs font-bold text-slate-900">Patient's Original Description</h4>
                      <div className="p-3 bg-white rounded-lg border border-slate-200/80 text-xs text-slate-800 italic">
                        &ldquo;It feels like an elephant is sitting right on my chest, and I can't catch my breath no matter how hard I try. Started about 20 minutes ago while walking.&rdquo;
                      </div>
                    </div>
                  </div>
                </div>
              </main>
            )}

            {/* Simple fallbacks for remaining views */}
            {currentView === "active-assessments" && (
              <main className="p-8 max-w-6xl mx-auto w-full space-y-4">
                <h2 className="text-xl font-bold text-slate-900">Active Queue Management</h2>
                <div className="bg-white rounded-2xl border border-slate-200 p-6">
                  <p className="text-xs text-slate-500">Real-time triage queue stream active with 14 walk-in sessions.</p>
                </div>
              </main>
            )}

            {currentView === "history" && (
              <main className="p-8 max-w-6xl mx-auto w-full space-y-4">
                <h2 className="text-xl font-bold text-slate-900">Triage History Records</h2>
                <div className="bg-white rounded-2xl border border-slate-200 p-6">
                  <p className="text-xs text-slate-500">Archived patient intake sessions and deterministic audit notes.</p>
                </div>
              </main>
            )}

            {currentView === "escalations" && (
              <main className="p-8 max-w-6xl mx-auto w-full space-y-4">
                <h2 className="text-xl font-bold text-rose-700">Active Human Escalations</h2>
                <div className="bg-rose-50 border border-rose-200 rounded-2xl p-6">
                  <p className="text-xs text-rose-900 font-semibold">5 cases flagged for mandatory attending clinician bedside review.</p>
                </div>
              </main>
            )}

            {currentView === "analytics" && (
              <main className="p-8 max-w-6xl mx-auto w-full space-y-4">
                <h2 className="text-xl font-bold text-slate-900">Clinical Analytics</h2>
                <div className="bg-white rounded-2xl border border-slate-200 p-6">
                  <p className="text-xs text-slate-500">Throughput, SLA adherence, and complaint track breakdowns.</p>
                </div>
              </main>
            )}

          </div>

          {/* Quick Triage Modal */}
          {showQuickTriage && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4">
                <div className="flex items-center justify-between border-b border-slate-100 pb-2">
                  <h3 className="font-bold text-sm text-slate-900">Quick Walk-in Triage</h3>
                  <button onClick={() => setShowQuickTriage(false)}>✕</button>
                </div>
                <textarea
                  rows={4}
                  value={patientNarrative}
                  onChange={(e) => setPatientNarrative(e.target.value)}
                  className="w-full p-3 text-xs bg-slate-50 border border-slate-200 rounded-lg"
                  placeholder="Enter patient complaint..."
                />
                <div className="flex justify-end gap-2">
                  <button onClick={() => setShowQuickTriage(false)} className="px-3 py-1.5 text-xs text-slate-600">Cancel</button>
                  <button
                    onClick={() => {
                      setShowQuickTriage(false);
                      setWorkflowStep(1);
                      setCurrentView("workflow");
                    }}
                    className="px-4 py-1.5 bg-[#0f2444] text-white text-xs font-semibold rounded-lg"
                  >
                    Start Triage
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Escalation Dispatched Modal */}
          {showEscalatedModal && (
            <div className="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-3">
                <div className="w-12 h-12 rounded-full bg-rose-100 text-rose-600 mx-auto flex items-center justify-center text-xl font-bold">
                  ✔
                </div>
                <h3 className="font-bold text-base text-slate-900">Human Review Dispatched</h3>
                <p className="text-xs text-slate-600">
                  Case escalated to Emergency Triage Unit. Attending Physician Dr. Sarah Chen notified. SLA &lt; 2 mins active.
                </p>
                <button
                  onClick={() => setShowEscalatedModal(false)}
                  className="w-full py-2 bg-[#0f2444] text-white text-xs font-bold rounded-lg mt-2"
                >
                  Close
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
